name: Validate website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  NEXT_TELEMETRY_DISABLED: 1
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
