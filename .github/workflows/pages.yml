name: Validate website and redirect legacy domain
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  NEXT_TELEMETRY_DISABLED: 1
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      # Keep explicit locale previews available; the legacy root points to Cloudflare.
      - name: Prepare legacy domain redirect
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p legacy-redirect
          cp -R out/. legacy-redirect/
          cat > legacy-redirect/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=https://agentclub.dev/en/">
            <link rel="canonical" href="https://agentclub.dev/en/">
            <title>Agent Club</title>
          </head>
          <body><p>Agent Club has moved to <a href="https://agentclub.dev/en/">agentclub.dev</a>.</p></body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: legacy-redirect
  redirect:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
